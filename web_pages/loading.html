<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GSEACompass</title>

    <link rel="stylesheet" type="text/css" href="../dependencies/datatables/datatables.min.css" />

    <style>
        :root {
            --rotate: -26deg;

            /* to make it responsive */
            --unit: 1vmin;
            --zoom: 160;
            --workspace-min: 768;
            /* device screen height = 768px */
            --upx: calc(var(--zoom) * (var(--unit) / var(--workspace-min)));
            /* upx = units per pixel */

            /* DNA Helix loop */
            --animation-speed: 1;
            --helix-duration: 0.5s;
            --helix-iteration-factor: 0.05s;

            /* DNA model */
            --dna-max-height: calc(140 * var(--upx));
            /* scale down the whole DNA structure (1 = original size) */
            --dna-scale: 0.3;
            --dna-nitrogenous-base-width: calc(6 * var(--upx));
            --dna-nitrogenous-base-margin: calc(8 * var(--upx));
            --dna-sugar-diameter: calc(15 * var(--upx));
            --dna-sugar-border-size: calc(6 * var(--upx));

            /* colors */
            --color-background: #ffffff;
            --color-sugar: #f2f1d5;
            --color-A: #ffba36;
            --color-T: #26f826;
            --color-C: #439AD9;
            --color-G: #E96451;
        }

        /* rotate the dna container for smart mobile devices */
        @media (orientation: portrait) {
            :root {
                --rotate: -58deg;
            }
        }

        /* to make things look pretty */
        html,
        body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        body {
            background: var(--color-background);
            overflow: auto;
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.4) rgba(0, 0, 0, 0);
        }

        /* align the DNA and label to middle; keep label unrotated */
        .center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .wrapper {
            /* keep wrapper unrotated so DNA stays horizontal; positioning handled by .center */
            transform: none;
            transform-origin: 50% 50%;
            display: inline-block;
        }

        .loading-text {
            /* position the label absolutely so it doesn't shift while the helix animates */
            position: absolute;
            left: 50%;
            top: calc(50% + (var(--dna-max-height) * var(--dna-scale) / 2) + (28 * var(--upx)));
            transform: translateX(-50%);
            font-size: calc(14 * var(--upx));
            color: #333;
            font-weight: 400;
            user-select: none;
            margin: 0;
            pointer-events: none;
        }

        /* DNA is a flex container with n-double helix */
        .dna {
            display: flex;
            align-items: center;
            position: relative;
            height: var(--dna-max-height);
            transform-origin: 50% 50%;
            transform: scale(var(--dna-scale));
        }

        /* helix (nitrogenous base) - use transform to avoid layout shifts */
        .dna>div {
            font-size: 0;
            position: relative;
            width: var(--dna-nitrogenous-base-width);
            height: var(--dna-max-height);
            background: linear-gradient(0deg, var(--color-G) 50%, var(--color-C) 50%);
            display: inline-block;
            margin: 0 var(--dna-nitrogenous-base-margin);
            transform-origin: 50% 50%;
            transform: scaleY(0);
            animation: double-helix ease calc(var(--helix-duration) / var(--animation-speed)) calc((var(--i) * var(--helix-iteration-factor)) / var(--animation-speed)) alternate infinite;
        }

        .dna>div:nth-child(2n) {
            background: linear-gradient(0deg, var(--color-A) 50%, var(--color-T) 50%);
        }

        @keyframes double-helix {
            to {
                transform: scaleY(1);
            }
        }

        /* sugar */
        .dna>div::before,
        .dna>div::after {
            content: "";
            position: absolute;
            left: 50%;
            width: var(--dna-sugar-diameter);
            height: var(--dna-sugar-diameter);
            display: block;
            border-radius: 50%;
            background: var(--color-sugar);
            border: var(--dna-sugar-border-size) solid var(--color-background);
            box-sizing: content-box;
        }

        .dna>div::before {
            top: 0;
            transform: translate(-50%, -50%);
        }

        .dna>div::after {
            bottom: 0;
            transform: translate(-50%, 50%);
        }
    </style>
</head>

<body style="margin:0;">

    <div class="center">

        <!-- Animation taken from https://codepen.io/ShadowShahriar/pen/eYgPjxX and slightly modified. Thank you ShadowShahriar! -->
        <!-- Animated DNA -->
        <div class="wrapper">
            <div class="dna">
                <div style="--i: 0">0</div>
                <div style="--i: 1">1</div>
                <div style="--i: 2">2</div>
                <div style="--i: 3">3</div>
                <div style="--i: 4">4</div>
                <div style="--i: 5">5</div>
                <div style="--i: 6">6</div>
                <div style="--i: 7">7</div>
                <div style="--i: 8">8</div>
                <div style="--i: 9">9</div>
                <div style="--i: 10">10</div>
                <div style="--i: 11">11</div>
                <div style="--i: 12">12</div>
                <div style="--i: 13">13</div>
                <div style="--i: 14">14</div>
                <div style="--i: 15">15</div>
                <div style="--i: 16">16</div>
                <div style="--i: 17">17</div>
                <div style="--i: 18">18</div>
                <div style="--i: 19">19</div>
                <div style="--i: 20">20</div>
                <div style="--i: 21">21</div>
                <div style="--i: 22">22</div>
                <div style="--i: 23">23</div>
            </div>
        </div>

        <div class="loading-text">Loading...</div>
    </div>

</body>

</html>
