<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GSEACompass</title>

    <script src="../renderer_src/table_renderer.js" defer></script>

    <script src="../dependencies/datatables/datatables.min.js"></script>
    <script src="../dependencies/ellipsis.js"></script>
    <link href="../dependencies/datatables/datatables.min.css" rel="stylesheet" />
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(195, 195, 195, 0.85);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            border: 16px solid #f3f3f3; /* Light grey */
            border-radius: 30%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <h1 class="display-6 m-3 text-center" id="table-title"></h1>

    <div id="dataDiv" class="m-3">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <!-- Filters on the left -->
            <div class="filters-left">
                <table>
                    <tbody>
                        <tr>
                            <td>Maximum FDR q-val</td>
                            <td><input class="form-control m-1" type="text" id="maxFDR" name="maxFDR" /></td>
                        </tr>
                        <tr>
                            <td>Maximum NOM p-val</td>
                            <td><input class="form-control m-1" type="text" id="maxNOM" name="maxNOM" /></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Back button on the right -->
            <div class="filters-right">
                <button id="back" class="btn btn-secondary">Back to Home</button>
            </div>

        </div>

        <!-- DataTable table -->
        <table id="dataTable" class="table table-striped" style="width:100%"></table>

    </div>

</body>

</html>
