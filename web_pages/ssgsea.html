<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>GSEACompass - ssGSEA</title>

    <script src="../renderer_src/ssgsea_renderer.js" defer></script>

    <link rel="stylesheet" type="text/css" href="../dependencies/datatables/datatables.min.css" />
</head>

<body>
    <div class="container mt-3">
        <form class="row">

            <!-- Gene sets input -->
            <div class="mb-3">
                <label for="gene_sets" class="form-label">Gene sets database (.gmt)</label>
                <img src="../icons/question_16px.svg" style="cursor: pointer; padding-left: 5px;"
                    onclick="showHelper('A gene sets file defines one or more gene sets. For each gene set, the file contains the gene set name and the list of genes in that gene set. A gene sets file is a tab-delimited text file in gmt format.')" />
                <input type="file" accept=".gmt" name="gene_sets" id="gene_sets" class="form-control" required />
            </div>

            <!-- Dataset input -->
            <div class="mb-3">
                <label for="data_set" class="form-label">Dataset (.gct, .txt, .rnk)</label>
                <img src="../icons/question_16px.svg" style="cursor: pointer; padding-left: 5px;"
                    onclick="showHelper('In can either be an expression dataset or a ranked list. An expression dataset file contains features (genes or probes), samples, and an expression value for each feature in each sample; it is a tab-delimited text file in gct or txt format. A ranked list file lists each gene identifier in the gene set and a matching unique ranking. This ranking list is used in GSEA pre-ranked instead of a typical automatically-computed ranking list by plain GSEA; it\'s a tab-delimited text file in rnk format.')" />
                <input type="file" accept=".gct, .txt, .rnk" name="data_set" id="data_set" class="form-control" required />
            </div>

            <!-- Min gene set size -->
            <div class="mb-3">
                <label for="min_gene_set" class="form-label">Min gene set size</label>
                <img src="../icons/question_16px.svg" style="cursor: pointer; padding-left: 5px;" 
                    onclick="showHelper('Gene set with less genes than this value will not be considered.')" />
                <input type="number" value="15" id="min_gene_set" name="min_gene_set" class="form-control" required />
            </div>

            <!-- Max gene set size -->
            <div class="mb-3">
                <label for="max_gene_set" class="form-label">Max gene set size</label>
                <img src="../icons/question_16px.svg" style="cursor: pointer; padding-left: 5px;" 
                    onclick="showHelper('Gene set with more genes than this value will not be considered.')" />
                <input type="number" value="500" id="max_gene_set" name="max_gene_set" class="form-control" required />
            </div>

            <div class="col-12 mb-3">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <!-- Button to go back to home window -->
                    <button type="button" id="back" class="btn btn-secondary">Back to home</button>

                    <!-- Button to run the analysis -->
                    <button type="button" id="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
