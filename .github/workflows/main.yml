name: Generate MSigDB Embeddings

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  # schedule:
  #   - cron: "0 0 1 * *" # Uncomment to run automatically on the 1st of every month

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # Speeds up future runs by caching heavy dependencies like PyTorch

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests beautifulsoup4 tqdm transformers torch

      - name: Run Script to Generate Embeddings
        run: |
          # Ensure this matches the exact name of your script in the repo
          python generate_embeddings.py

      - name: Commit and Push .pkl File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update msigdb embeddings in misc_resources"
          # Looks in the misc_resources folder at the root of the repo
          file_pattern: "misc_resources/new_msigdb_embeddings.pkl"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
